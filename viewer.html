function load(obj){R=obj;t=0;play=true;const W=Math.max(...R.frames.flatMap(f=>f.m.map(m=>m[0])),40),H=Math.max(...R.frames.flatMap(f=>f.m.map(m=>m[1])),30);SC=Math.min(800/Math.max(40,Math.ceil(W)),600/Math.max(30,Math.ceil(H)));}
load(R);
$('pl').onclick=()=>{play=!play;$('pl').textContent=play?'멈춤':'재생';};$('sp').onchange=e=>spd=+e.target.value;$('sk').oninput=e=>{t=e.target.value/1000*R.t;};
const rd=f=>{const r=new FileReader();r.onload=()=>{try{load(JSON.parse(r.result));}catch(e){alert('읽을 수 없는 파일');}};r.readAsText(f);};
$('file').onchange=e=>e.target.files[0]&&rd(e.target.files[0]);document.addEventListener('dragover',e=>e.preventDefault());document.addEventListener('drop',e=>{e.preventDefault();e.dataTransfer.files[0]&&rd(e.dataTransfer.files[0]);});
function draw(){const F=R.frames;let i=0;while(i<F.length-1&&F[i+1].t<=t)i++;const f0=F[i],g=F[i+1],al=g&&g.t>f0.t?Math.min(1,(t-f0.t)/(g.t-f0.t)):0,f=al?Object.assign({},f0,{m:f0.m.map((q,k)=>{const r=g.m[k];if(!r)return q;const o=q.slice();o[0]=q[0]+(r[0]-q[0])*al;o[1]=q[1]+(r[1]-q[1])*al;if(q.length>10)o[10]=q[10]+(r[10]-q[10])*al;return o;})}):f0;/* 사이를 이어 그린다 (v2.4) */ctx.fillStyle='#34322d';ctx.fillRect(0,0,800,600);
 for(const z of f.z){ctx.fillStyle=ZC[z[0]]||'rgba(255,255,255,.1)';if(z[4]>0){ctx.save();ctx.translate(z[1]*SC,z[2]*SC);ctx.rotate(z[5]);ctx.fillRect(-z[4]/2*SC,-0.6*SC,z[4]*SC,1.2*SC);ctx.restore();}else{ctx.beginPath();ctx.arc(z[1]*SC,z[2]*SC,(z[3]||1)*SC,0,7);ctx.fill();}}
 for(const o of R.obs){ctx.fillStyle='#6e685f';ctx.beginPath();ctx.arc(o.x*SC,o.y*SC,o.r*SC,0,7);ctx.fill();}
 for(const b of f.b||[]){ctx.fillStyle=b[2]?'#3a2a20':'#a8744a';ctx.beginPath();ctx.arc(b[0]*SC,b[1]*SC,6,0,7);ctx.fill();}
 for(const w of f.w){ctx.fillStyle='#9a938a';ctx.beginPath();ctx.arc(w[0]*SC,w[1]*SC,w[2]*SC,0,7);ctx.fill();}
 for(const a of f.a){ctx.strokeStyle='rgba(230,240,255,.7)';ctx.setLineDash([4,4]);ctx.beginPath();ctx.arc(a[0]*SC,a[1]*SC,a[2]*SC,0,7);ctx.stroke();ctx.setLineDash([]);}
 for(const tr of f.tr){ctx.fillStyle='rgba(255,255,255,.5)';ctx.beginPath();ctx.moveTo(tr[0]*SC,tr[1]*SC-6);ctx.lineTo(tr[0]*SC+5,tr[1]*SC+4);ctx.lineTo(tr[0]*SC-5,tr[1]*SC+4);ctx.fill();}
 for(const p of f.p){ctx.fillStyle='#e9e4d8';ctx.beginPath();ctx.arc(p[0]*SC,p[1]*SC,3,0,7);ctx.fill();}
 for(let j=Math.max(0,i-3);j<=i;j++)for(const x of F[j].fx){ctx.globalAlpha=1-(i-j)/4;if(x[0]==='z'){ctx.strokeStyle='#e6f3ff';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(x[1]*SC,x[2]*SC);for(let s=1;s<6;s++)ctx.lineTo((x[1]+(x[3]-x[1])*s/6)*SC+(Math.random()-.5)*8,(x[2]+(x[4]-x[2])*s/6)*SC+(Math.random()-.5)*8);ctx.lineTo(x[3]*SC,x[4]*SC);ctx.stroke();}else{ctx.fillStyle='rgba(255,200,130,.5)';ctx.beginPath();ctx.arc(x[1]*SC,x[2]*SC,x[3]*SC,0,7);ctx.fill();}ctx.globalAlpha=1;}
 f.m.forEach((m,k)=>{const x=m[0]*SC,y=m[1]*SC,c=COL[m[7]%4];ctx.globalAlpha=m[2]<=0?.25:(m[5]&32?.55:1);ctx.fillStyle='#1b1c20';ctx.beginPath();ctx.arc(x,y,8,0,7);ctx.fill();ctx.strokeStyle=c;ctx.lineWidth=2.6;ctx.stroke();ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+Math.cos(m[6])*13,y+Math.sin(m[6])*13);ctx.stroke();
  if(m[5]&16){ctx.strokeStyle='#d8d1c3';ctx.lineWidth=3;ctx.beginPath();ctx.arc(x,y,13,m[6]-0.9,m[6]+0.9);ctx.stroke();}
  if(m[5]&64){ctx.strokeStyle='rgba(255,255,255,.6)';ctx.setLineDash([2,3]);ctx.beginPath();ctx.arc(x,y,15,0,7);ctx.stroke();ctx.setLineDash([]);}
  if(m[3]&&m[2]>0){ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.beginPath();ctx.arc(x,y,11,-1.57,-1.57+m[4]*6.28);ctx.stroke();ctx.font='10px system-ui';ctx.textAlign='center';ctx.fillStyle='#e9e4d8';ctx.fillText(m[3],x,y+22);}
  const hm=(R.hpMax&&R.hpMax[k])||150;ctx.globalAlpha=1;ctx.fillStyle='rgba(0,0,0,.6)';ctx.fillRect(x-14,y-16,28,3);ctx.fillStyle=c;ctx.fillRect(x-14,y-16,28*Math.max(0,m[2])/hm,3);ctx.fillStyle='#ff8a7a';ctx.fillRect(x-14,y-12,28*Math.min(1,(m[8]||0)/100),1.5);
  ctx.font='600 10px system-ui';ctx.textAlign='center';ctx.fillStyle=c;ctx.fillText((R.names?R.names[k]:'')+' '+(m[9]||''),x,y-20);});
 $('ck').textContent=t.toFixed(1)+' / '+R.t+'초';$('sk').value=Math.round(t/R.t*1000);if(t>=R.t-0.05){ctx.font='24px system-ui';ctx.textAlign='center';ctx.fillStyle=R.winner>=0?COL[R.winner]:'#e9e4d8';ctx.fillText(R.winner>=0?'편 '+R.winner+' 승리':'무승부',400,36);}}
let last=performance.now();function loop(n){const d=Math.min(0.1,(n-last)/1000);last=n;if(play){t+=d*spd;if(t>R.t){t=R.t;play=false;$('pl').textContent='재생';}}draw();requestAnimationFrame(loop);}requestAnimationFrame(loop);
</script></body></html>
