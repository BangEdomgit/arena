<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>숨 샌드박스 v0.3</title>
<style>
:root{--ink:#e9e4d8;--muted:rgba(233,228,216,.6);--line:rgba(233,228,216,.14);--bg:#121317;--panel:#191a1f;--field:rgba(233,228,216,.07);--accent:#6fb7ff}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:13px/1.45 system-ui,sans-serif}
header{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:8px 12px;border-bottom:1px solid var(--line)}
header h1{font-size:16px;margin:0 8px 0 0;font-weight:650}
.sub{color:var(--muted);font-size:12px}
button,select,input,label.btn{font:inherit;font-size:12.5px;color:var(--ink);background:var(--field);border:1px solid var(--line);border-radius:4px;padding:4px 8px}
button,label.btn{cursor:pointer}button:hover,label.btn:hover{border-color:rgba(233,228,216,.4)}
button:disabled{opacity:.4;cursor:default}
button.on{background:rgba(111,183,255,.2);border-color:var(--accent)}
input[type=number]{width:64px}input[type=text]{width:100%}input[type=checkbox]{accent-color:var(--accent)}
main{display:grid;grid-template-columns:300px minmax(0,1fr) 280px;gap:10px;padding:10px 12px;align-items:start}
@media (max-width:1100px){main{grid-template-columns:minmax(0,1fr);padding:10px 16px}header{padding:8px 16px}}
select{max-width:100%}#scenes{max-width:min(420px,100%)}
section.panel{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:10px;min-width:0}
h2{font-size:13px;margin:0 0 8px;font-weight:650}
.stage{position:relative;width:100%;aspect-ratio:4/3;border-radius:6px;overflow:hidden;box-shadow:0 0 0 1px var(--line);background:#34322d}
canvas{display:block;width:100%;height:100%;touch-action:none}
.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:8px 0}
.side{border:1px solid var(--line);border-radius:5px;padding:8px;margin-bottom:8px}
.side .head{display:flex;gap:6px;align-items:center}
.side .head input{flex:1}
.sw{width:12px;height:12px;border-radius:50%;flex:none}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.chip{font-size:11.5px;padding:2px 6px;border-radius:10px;border:1px solid var(--line);cursor:pointer;background:transparent;color:var(--ink)}
.chip.sel{border-color:var(--accent);background:rgba(111,183,255,.18)}
.grid{display:grid;grid-template-columns:auto 1fr;gap:5px 8px;align-items:center}
.grid label{color:var(--muted);font-size:12px}
.grid select,.grid input[type=text]{width:100%}
.tabs{display:flex;gap:4px;margin-bottom:8px}
.rule{margin-bottom:9px}.rule .top{display:flex;justify-content:space-between;align-items:center;gap:6px}
.rule input[type=range]{width:100%}
.rule .d{color:var(--muted);font-size:11.5px}
table{border-collapse:collapse;width:100%;font-size:12px}
th,td{text-align:right;padding:3px 6px;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left}
.tablewrap{overflow-x:auto}
#result{font-weight:650}
.scrub{display:flex;gap:8px;align-items:center;margin:6px 0 0}.scrub input{flex:1;min-width:0}
#scrubT{min-width:118px;text-align:right}
#err{color:#ff8a7a}
.hint{color:var(--muted);font-size:11.5px;margin:6px 0 0}
.leg{margin:6px 0;padding-left:18px;font-size:12px;color:var(--muted)}#legend{margin-bottom:10px}
</style>
</head>
<body>
<header>
  <h1>숨 샌드박스 <span class="sub" id="ver"></span></h1>
  <select id="scenes" title="예시 장면"></select>
  <label class="btn" title="장면 JSON 불러오기">불러오기<input id="file" type="file" accept=".json,application/json" hidden></label>
  <button id="exportScene" type="button">장면 내보내기</button>
  <button id="exportRec" type="button">녹화 내보내기</button>
  <span class="sub">장면 JSON을 끌어다 놓아도 된다. 녹화는 <code>viewer.html</code>에서 본다.</span>
</header>
<main>
  <section class="panel" aria-label="편과 사람">
    <h2>편과 사람</h2>
    <div id="sides"></div>
    <button id="addSide" type="button">편 추가</button>
    <div id="mageEd"></div>
  </section>

  <div>
    <div class="stage"><canvas id="cv" width="800" height="600"></canvas></div>
    <div class="scrub" title="되감기 막대: 판 어디로든 끈다. 같은 장면을 앞서 돌려 끝을 안다 (결정론, v2.14)"><input id="scrub" type="range" min="0" max="0" step="any" value="0" aria-label="되감기"><span id="scrubT" class="sub"></span></div>
    <div class="row">
      <button id="play" type="button">재생</button>
      <button id="step" type="button" title="한 걸음 (1/30초, 잘게 걷기면 1/60초)">한 걸음</button>
      <button id="reset" type="button" title="처음 자리로">처음으로</button>
      <select id="speed" title="배속"><option value="0.1">0.1배</option><option value="0.25">0.25배</option><option value="0.5">0.5배</option><option value="1" selected>1배</option><option value="2">2배</option><option value="4">4배</option><option value="8">8배</option><option value="0">최대</option></select>
      <label class="sub">씨앗 <input id="seed" type="number" step="1"></label>
      <label class="sub" title="판이 돌면 사람들을 따라가며 확대 (v2.13)"><input type="checkbox" id="follow" checked> 따라가기</label>
      <label class="sub" title="큰 피해·덫 발동·쓰러짐·속임수·덮기 직전에 저절로 느려졌다 돌아온다 (앞서 돌려 미리 안다, v2.14)"><input type="checkbox" id="slowmo" checked> 사건 직전 느리게</label>
      <label class="sub" title="몰이 화살표, 상대가 피할 곳 점과 덮은 마법, 노리는 자리(흐림)와 실제 자리, 속임수, 걸어둔 마법 점선 (v2.14)"><input type="checkbox" id="mind"> 판단 그림</label>
      <span id="clock" class="sub"></span>
      <span id="result"></span>
    </div>
    <div class="row" title="마법 그림 (v0.3): 빛깔 = 원소, 모양 = 종류">
      <span class="sub">보기</span>
      <label class="sub"><input type="checkbox" id="vName" checked> 이름</label>
      <label class="sub"><input type="checkbox" id="vPre" checked> 예고 원</label>
      <label class="sub"><input type="checkbox" id="vSt" checked> 상태 표시</label>
      <label class="sub"><input type="checkbox" id="vLeg"> 범례</label>
      <label class="sub" title="숨은 덫·숨긴 예고를 누구 눈으로 보나">보는 편 <select id="viewSide"><option value="-1">모두</option><option value="0">편 0</option><option value="1">편 1</option></select></label>
    </div>
    <div class="row" id="tools" role="toolbar" aria-label="놓기 도구">
      <span class="sub">도구</span>
      <button type="button" data-tool="move" class="on" title="눌러 고르고 끌어서 옮긴다. Delete로 지운다">고르기·옮기기</button>
      <button type="button" data-tool="mage">사람</button>
      <button type="button" data-tool="obs">바위</button>
      <button type="button" data-tool="barrel">화약통</button>
      <button type="button" data-tool="wall">벽</button>
      <button type="button" data-tool="erase">지우기</button>
    </div>
    <p class="hint" id="note"></p>
    <p id="err"></p>
    <section class="panel" id="legend" hidden></section>
    <section class="panel">
      <h2>기록</h2>
      <div class="tablewrap"><table id="stats"></table></div>
    </section>
  </div>

  <section class="panel" aria-label="규칙과 장면">
    <div class="tabs"><button type="button" data-tab="rules" class="on">규칙</button><button type="button" data-tab="scene">장면</button></div>
    <div id="tab-rules"></div>
    <div id="tab-scene" hidden></div>
  </section>
</main>

<!-- 엔진은 명령줄과 같은 파일을 그대로 읽는다. data.js는 JSON을 싼 것 (node cli.js pack) -->
<script src="arena.js"></script>
<script src="sandbox.js"></script>
</body>
</html>
